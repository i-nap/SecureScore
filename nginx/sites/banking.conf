server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_trusted_certificate /etc/nginx/certs/ca.crt;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    limit_conn conn_limit 20;
    limit_req zone=global_limit burst=20 nodelay;

    # Auth service endpoints
    location /auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://auth_service/;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # Login endpoint — tighter rate limit
    location /auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://auth_service/login;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # Banking API endpoints
    location /api/banking/ {
        proxy_pass http://banking_service/;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # Health probe (unauthenticated, no rate limit needed)
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Deny everything else
    location / {
        return 404;
    }
}
