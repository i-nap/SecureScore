user nginx;
worker_processes auto;
worker_rlimit_nofile 65536;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_access escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_access;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30;
    server_tokens off;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m  rate=60r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Docker's embedded DNS — re-resolve hostnames on every request
    # (required so proxy_pass $var picks up new IPs after container restarts)
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server (TLSv1.2 + TLSv1.3) ────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_tickets off;

        client_max_body_size 1m;
        limit_conn conn_limit 50;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin" always;

        # Use variables for proxy_pass so the resolver re-resolves on each request.
        # Static upstream blocks cache IPs at startup and break after container restarts.
        # ponytail: single inline Go BFF, not the parked auth/banking microservices.
        set $bff_upstream      "bff:4000";
        set $frontend_upstream "frontend:3000";

        # Auth endpoints — stricter rate limit (BFF serves /api/auth/*)
        location /api/auth/ {
            limit_req zone=login_limit burst=30 nodelay;
            proxy_pass http://$bff_upstream;
            include /etc/nginx/snippets/proxy_headers.conf;
        }

        # All BFF API + WebSocket
        location /api/ {
            limit_req zone=global_limit burst=40 nodelay;
            proxy_pass http://$bff_upstream;
            include /etc/nginx/snippets/proxy_headers.conf;
        }

        location /ws/ {
            proxy_pass http://$bff_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            include /etc/nginx/snippets/proxy_headers.conf;
        }

        location = /health {
            proxy_pass http://$bff_upstream/api/health;
            include /etc/nginx/snippets/proxy_headers.conf;
        }

        # Next.js frontend (everything else)
        location / {
            proxy_pass http://$frontend_upstream;
            include /etc/nginx/snippets/proxy_headers.conf;
        }
    }

    # ── HTTP-only fallback for local dev (no cert) ────────────────────────
    # Remove this block in production; certificates are required.
    # server {
    #     listen 8080;
    #     server_name _;
    #     ... dev proxy config ...
    # }
}
