[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-omit=tests/*,generate_data.py,generate_certs.py,generate_banking_data.py,generate_realistic_nepal.py
    --cov-fail-under=70
log_cli = true
log_cli_level = WARNING
markers =
    unit: fast isolated unit tests
    integration: tests requiring live services
    slow: slow tests (load, E2E)
