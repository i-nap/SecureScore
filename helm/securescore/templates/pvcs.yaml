---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "securescore.fullname" . }}-hq-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "securescore.labels" . | nindent 4 }}
    app.kubernetes.io/component: hq-server
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass | default "" | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.hqStateSize | default "10Gi" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "securescore.fullname" . }}-audit-chain
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "securescore.labels" . | nindent 4 }}
    app.kubernetes.io/component: hq-server
  annotations:
    # Retain on delete — audit chain must never be auto-deleted (NRB 7-year requirement)
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  # Use a StorageClass with Retain reclaim policy for audit chain
  storageClassName: {{ .Values.persistence.auditStorageClass | default .Values.persistence.storageClass | default "" | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.auditChainSize | default "5Gi" }}
