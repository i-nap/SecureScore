{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "securescore.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "securescore.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "securescore.fullname" . }}-env
    creationPolicy: Owner
  data:
    - secretKey: BFF_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}/bff
        property: secret_key
    - secretKey: HQ_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}/hq
        property: secret_key
    - secretKey: HQ_BRANCH_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}/hq
        property: api_key
    - secretKey: WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}/webhooks
        property: secret
    - secretKey: GROQ_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}/ai
        property: groq_key
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}/db
        property: password
{{- else }}
# External secrets disabled — set secrets via --set or values.yaml
# WARNING: Never commit actual secret values to version control
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "securescore.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "securescore.labels" . | nindent 4 }}
  annotations:
    # Replace placeholder values before deploying to production
    helm.sh/chart-note: "Replace placeholder secrets before production deployment"
type: Opaque
stringData:
  BFF_SECRET_KEY: {{ .Values.secrets.bffSecretKey | required "secrets.bffSecretKey is required" | quote }}
  HQ_SECRET_KEY: {{ .Values.secrets.hqSecretKey | required "secrets.hqSecretKey is required" | quote }}
  HQ_BRANCH_API_KEY: {{ .Values.secrets.hqBranchApiKey | required "secrets.hqBranchApiKey is required" | quote }}
  WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | default "" | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | default "" | quote }}
{{- end }}
